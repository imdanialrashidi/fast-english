# Managed by universal-pi-to-omp.sh.
# Application CI remains in the project's existing workflows.
name: omp-workflow

on:
  pull_request:
  push:
    branches: [main, ai-changes]

permissions:
  contents: read

concurrency:
  group: omp-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Scan committed tree for obvious secrets
        run: bash scripts/omp-secret-scan.sh

      - name: Validate OMP workflow contract
        run: |
          bash scripts/omp-doctor.sh --static
          node --test tests/ai-pr.test.mjs tests/context-readiness.test.mjs tests/eval-isolation.test.mjs tests/native-contract.test.mjs tests/omp-rpc.test.mjs tests/safety-guard.test.mjs tests/skill-contract.test.mjs tests/test-design-contract.test.mjs tests/verify-affected.test.mjs tests/workflow-evals.test.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, reviewed 2026-08-26
        with:
          bun-version: 1.3.14

      - name: Install reviewed OMP into CI-only directory
        run: bun install --cwd .github/omp-runtime --ignore-scripts

      - name: Validate real OMP CLI and project discovery
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/omp-workflow-agent
          OMP_PACKAGE_ROOT: ${{ github.workspace }}/.github/omp-runtime/node_modules/@oh-my-pi/pi-coding-agent
          AI_PR_DELIVERY: "off"
        run: |
          export PATH="$PWD/.github/omp-runtime/node_modules/.bin:$PATH"
          node scripts/omp-native-smoke.mjs
          bun scripts/omp-discovery-smoke.ts
