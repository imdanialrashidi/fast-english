name: quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Canonical release gate, split into independent lanes so unrelated work
# runs concurrently:
#
#   static   — OMP harness validation + typecheck + Biome + Vitest (cheap,
#              high-signal checks fail first).
#   backend  — the real full backend/operations gate: all 16 real-PocketBase
#              smoke suites (each on its own disposable PocketBase, run
#              concurrently via scripts/verify-smokes-parallel.sh) + the
#              deterministic three-surface builds + topology/boundary/PWA/
#              Android/deploy checks (scripts/project-verify.sh).
#   e2e      — the full Playwright suite sharded across independent runners.
#              Every shard owns its disposable PocketBase + preview servers
#              (no cross-shard fixture/state sharing), keeps CI retries and
#              failure traces, and uploads failure artifacts keyed by shard.
#   verify   — merge gate: green only when every lane is green.
#
# The local full gate (pnpm verify:full / scripts/verify-full.sh) is
# unchanged and remains the canonical serial model for review-time runs.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}-1.62.0
          restore-keys: |
            ${{ runner.os }}-playwright-

      # OMP harness validation: repository workflow contract, package pins,
      # MCP policy, launcher policy, secret scan, harness behavior tests.
      # `--ci` tolerates the missing Pi CLI and requires no dependencies.
      - name: OMP harness validation
        run: bash scripts/omp-doctor.sh --static

      - name: Install dependencies
        env:
          CI_SKIP_PLAYWRIGHT: '1'
        run: bash scripts/ci-install.sh

      # Production dependency advisories (npmjs registry; the local
      # mirror lacks the audit endpoint, so this runs in CI only).
      # --audit-level high fails the job on high/critical advisories.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Everyday gate: typecheck + Biome + Vitest (743 unit tests).
      - name: Fast verification (typecheck + Biome + Vitest)
        run: bash scripts/verify-fast.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    env:
      CI_SKIP_PLAYWRIGHT: '1'
      FEP_VERIFY_PARALLEL_SMOKES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}-1.62.0
          restore-keys: |
            ${{ runner.os }}-playwright-


      - name: Install dependencies
        run: bash scripts/ci-install.sh

      - name: Provision PocketBase test binary
        run: bash scripts/setup-pocketbase.sh

      # The access-log token-redaction drill (step 23 of project-verify.sh)
      # requires a real caddy binary; the drill is the proof for the
      # documented "audio file token travels as a URL query parameter"
      # vector and must run in the canonical gate. Pin matches the deploy
      # tooling's verified version (docs/PLAN.md P4-S3: v2.10.2).
      - name: Provision Caddy (access-log redaction drill)
        run: |
          CADDY_VERSION="v2.10.2"
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/${CADDY_VERSION}/caddy_${CADDY_VERSION#v}_linux_amd64.tar.gz" -o /tmp/caddy.tgz
          tar -xzf /tmp/caddy.tgz -C /tmp caddy
          sudo mv /tmp/caddy /usr/local/bin/caddy
          caddy version

      # The real Fast English backend + operations gate: typecheck + Biome +
      # Vitest + all 18 real-PocketBase smoke suites (concurrent, isolated) +
      # deterministic three-surface builds + topology/boundary checks + PWA
      # output checks + Android version/signing fail-safes + deploy
      # token-redaction proofs. Never replaced by a generic or fast lane.
      - name: Verify (backend release gate)
        env:
          FEP_REQUIRE_CADDY: '1'
        run: bash scripts/project-verify.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static
    strategy:
      fail-fast: false
      matrix:
        # 5 shards: the largest file (visual-slice-2, 69 tests) gets its own
        # shard and the remaining files spread to ~88 max, balancing the
        # critical path far better than 4 shards (max 129).
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
        include:
          - shard: 1/5
            slug: shard-1-5
          - shard: 2/5
            slug: shard-2-5
          - shard: 3/5
            slug: shard-3-5
          - shard: 4/5
            slug: shard-4-5
          - shard: 5/5
            slug: shard-5-5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}-1.62.0
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bash scripts/ci-install.sh

      # The player-lifecycle suite generates its 600s audio fixture with
      # ffmpeg and FAILS LOUDLY when it is absent (never silently falls
      # back to a shorter clip). ubuntu-latest does not ship ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Provision PocketBase test binary
        run: bash scripts/setup-pocketbase.sh

      # Full Playwright suite (critical + visual + responsive coverage) on
      # this shard. Each shard runs its own global-setup PocketBase and its
      # own built preview servers; fixture ownership is per-shard by design.
      - name: Run Playwright shard ${{ matrix.shard }}
        run: CI=1 npx playwright test --shard=${{ matrix.shard }}

      # Failure artifacts: per-shard traces/screenshots/error contexts +
      # the HTML report so the failing shard is identifiable by name.
      - name: Upload failure artifacts (shard ${{ matrix.shard }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # The shard value contains '/' (e.g. 4/5), which is not a valid
          # artifact-name character on GitHub Actions; each shard carries a
          # sanitized slug so a failing shard actually uploads its traces.
          name: e2e-artifacts-${{ matrix.slug }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    if: always()
    needs: [static, backend, e2e]
    timeout-minutes: 5
    steps:
      - name: All quality lanes passed
        run: |
          if [[ "${{ needs.static.result }}" == "success" && "${{ needs.backend.result }}" == "success" && "${{ needs.e2e.result }}" == "success" ]]; then
            echo "static, backend, and e2e (all shards) passed."
          else
            echo "one or more quality lanes failed: static=${{ needs.static.result }} backend=${{ needs.backend.result }} e2e=${{ needs.e2e.result }}" >&2
            exit 1
          fi
