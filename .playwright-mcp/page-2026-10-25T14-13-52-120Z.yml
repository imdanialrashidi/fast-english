        - paragraph [ref=e26]: ۳. اختلال فنی مستمر که دسترسی به محتوا را غیرممکن کرده و از سوی پشتیبانی قابل رفع نبوده است.
        - paragraph [ref=e27]: برای ثبت درخواست، حداکثر ۷ روز پس از پرداخت، شمارهٔ پیگیری یا تصویر رسید و ایمیل حساب را از کانال @test بفرستید. درخواست‌ها پس از بررسی پرداخت و وضعیت دسترسی پاسخ داده می‌شوند. مبلغ تأییدشده به همان کارت یا حسابی که پرداخت از آن انجام شده بازگردانده می‌شود؛ زمان نشست مبلغ به بانک بستگی دارد.
        - paragraph [ref=e28]: اگر اشتراک را پیش از فعال‌شدن دسترسی لغو کنید و پرداخت تأیید شده باشد، درخواست بازگشت وجه در همین چارچوب بررسی می‌شود. این متن جایگزین حقوق قانونی شما نیست و در صورت وجود الزام قانونی، همان الزام رعایت می‌شود.
