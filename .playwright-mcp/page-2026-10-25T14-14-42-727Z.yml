        - paragraph [ref=f1e23]: "Fast English یک محصول دیجیتال است. به همین دلیل پس از فعال‌شدن دسترسی، بازگشت وجه به‌طور عمومی انجام نمی‌شود؛ اما در موارد زیر درخواست شما بررسی می‌شود:"
        - paragraph [ref=f1e24]: ۱. پرداخت تکراری یا واریز بیش از مبلغ پلن.
        - paragraph [ref=f1e25]: ۲. پرداخت انجام شده اما اشتراک پس از تأیید فعال نشده است.
        - paragraph [ref=f1e26]: ۳. اختلال فنی مستمر که دسترسی به محتوا را غیرممکن کرده و از سوی پشتیبانی قابل رفع نبوده است.
        - paragraph [ref=f1e27]: برای ثبت درخواست، حداکثر ۷ روز پس از پرداخت، شمارهٔ پیگیری یا تصویر رسید و ایمیل حساب را از کانال @test بفرستید. درخواست‌ها پس از بررسی پرداخت و وضعیت دسترسی پاسخ داده می‌شوند. مبلغ تأییدشده به همان کارت یا حسابی که پرداخت از آن انجام شده بازگردانده می‌شود؛ زمان نشست مبلغ به بانک بستگی دارد.
        - paragraph [ref=f1e28]: اگر اشتراک را پیش از فعال‌شدن دسترسی لغو کنید و پرداخت تأیید شده باشد، درخواست بازگشت وجه در همین چارچوب بررسی می‌شود. این متن جایگزین حقوق قانونی شما نیست و در صورت وجود الزام قانونی، همان الزام رعایت می‌شود.
