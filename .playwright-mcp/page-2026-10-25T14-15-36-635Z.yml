                - text: Terms of use
                - textbox "Terms of use" [ref=f5e167]: "Fast English خدمتی برای خواندن و شنیدن متن‌های کوتاه انگلیسی است. با ساخت حساب یا خرید اشتراک، این شرایط را می‌پذیرید. ۱. حساب کاربری: برای خرید و ذخیرهٔ پیشرفت به حساب نیاز دارید. اطلاعات حساب باید درست و متعلق به خودتان باشد. مسئولیت حفظ رمز عبور با شماست. ۲. اشتراک و دسترسی: اشتراک پس از تأیید پرداخت فعال می‌شود و دسترسی برای همان مدت اعلام‌شده در پلن ادامه دارد. اشتراک شخصی است و به شخص دیگری منتقل نمی‌شود. ۳. پرداخت: پرداخت فعلی به‌صورت کارت‌به‌کارت انجام می‌شود. مبلغ و شمارهٔ کارت پیش از واریز در صفحهٔ پرداخت نمایش داده می‌شود. پس از واریز، رسید را از همان صفحه ارسال کنید. اشتراک فقط پس از بررسی و تأیید فعال می‌شود. ۴. محتوا و مالکیت: متن‌ها، صوت‌ها، تصاویر و طراحی‌ها متعلق به Fast English یا دارای مجوز هستند. استفادهٔ شخصی مجاز است؛ بازنشر، فروش، دانلود انبوه یا استفادهٔ تجاری بدون اجازه ممنوع است. ۵. استفادهٔ منصفانه: تلاش برای دسترسی غیرمجاز، اخلال در سرویس، اشتراک‌گذاری حساب یا استخراج خودکار محتوا مجاز نیست و می‌تواند به تعلیق حساب منجر شود. ۶. در دسترس بودن: برای پایداری سرویس تلاش می‌شود، اما قطعی موقت، تعمیرات یا اختلال شبکه ممکن است رخ دهد. در صورت اختلال طولانی، از کانال پشتیبانی پیگیری کنید. ۷. تغییر شرایط: اگر این شرایط به‌طور معنادار تغییر کند، نسخهٔ به‌روز از همین صفحه منتشر می‌شود. ادامهٔ استفاده پس از انتشار نسخهٔ جدید به معنای پذیرش آن است. ۸. پشتیبانی: پرسش‌ها و درخواست‌ها را از صفحهٔ پشتیبانی یا کانال @test ارسال کنید. شرایط بازگشت وجه در صفحهٔ «بازگشت وجه» آمده است."
              - generic [ref=f5e168]:
                - text: Privacy policy
                - textbox "Privacy policy" [ref=f5e169]: "Fast English برای ارائهٔ سرویس فقط داده‌هایی را نگه می‌دارد که به آن نیاز دارد. این صفحه توضیح می‌دهد چه داده‌ای جمع می‌شود، چرا، و چگونه نگهداری می‌شود. ۱. داده‌هایی که جمع می‌شود: نام، ایمیل، رمز عبور هش‌شده، سطح و هدف یادگیری، پیشرفت درس‌ها، واژه‌های ذخیره‌شده، درخواست‌های پرداخت، تصویر رسید و اطلاعات لازم برای بررسی آن. ۲. چرا جمع می‌شود: برای ساخت و امنیت حساب، ارائهٔ درس‌ها و پیشرفت، فعال‌سازی اشتراک، بررسی رسید، پشتیبانی و جلوگیری از سوءاستفاده. ۳. نگهداری: داده‌های حساب تا زمان حذف حساب نگه‌داری می‌شود. تصویر رسید و اطلاعات پرداخت فقط برای مدت لازم برای بررسی و پاسخ‌گویی نگه‌داری می‌شود و پس از آن حذف یا بی‌نام می‌شود. داده‌ای که قانون یا نیاز امنیتی نگه‌داری آن را لازم کند، مستثناست. ۴. اشتراک‌گذاری: داده‌های شخصی فروخته نمی‌شود. دسترسی به آن فقط برای کارکنان لازم و سرویس‌دهندگانی است که میزبانی، ایمیل یا پرداخت را انجام می‌دهند و به آن نیاز دارند. ۵. امنیت: رمز عبور به‌صورت هش نگه‌داری می‌شود، دسترسی کارکنان محدود است و رسیدها از مسیر خصوصی ارائه می‌شوند. هیچ روشی امنیت مطلق نیست؛ اگر نشانهٔ دسترسی غیرمجاز دیدید، از کانال پشتیبانی اطلاع دهید. ۶. کوکی و نشست: برای ورود، امنیت فرم‌ها و نگه‌داری نشست از کوکی استفاده می‌شود. حذف کوکی‌های ضروری می‌تواند باعث خروج از حساب شود. ۷. حقوق شما: می‌توانید اطلاعات حساب را اصلاح کنید یا حذف آن را از کانال پشتیبانی بخواهید. درخواست‌های مربوط به داده، پس از بررسی هویت و با رعایت محدودیت‌های قانونی بررسی می‌شود. ۸. تماس: پرسش‌های حریم خصوصی را از صفحهٔ پشتیبانی یا کانال @test بفرستید."
              - generic [ref=f5e170]:
                - text: Refund policy
                - textbox "Refund policy" [ref=f5e171]: "Fast English یک محصول دیجیتال است. به همین دلیل پس از فعال‌شدن دسترسی، بازگشت وجه به‌طور عمومی انجام نمی‌شود؛ اما در موارد زیر درخواست شما بررسی می‌شود: ۱. پرداخت تکراری یا واریز بیش از مبلغ پلن. ۲. پرداخت انجام شده اما اشتراک پس از تأیید فعال نشده است. ۳. اختلال فنی مستمر که دسترسی به محتوا را غیرممکن کرده و از سوی پشتیبانی قابل رفع نبوده است. برای ثبت درخواست، حداکثر ۷ روز پس از پرداخت، شمارهٔ پیگیری یا تصویر رسید و ایمیل حساب را از کانال @test بفرستید. درخواست‌ها پس از بررسی پرداخت و وضعیت دسترسی پاسخ داده می‌شوند. مبلغ تأییدشده به همان کارت یا حسابی که پرداخت از آن انجام شده بازگردانده می‌شود؛ زمان نشست مبلغ به بانک بستگی دارد. اگر اشتراک را پیش از فعال‌شدن دسترسی لغو کنید و پرداخت تأیید شده باشد، درخواست بازگشت وجه در همین چارچوب بررسی می‌شود. این متن جایگزین حقوق قانونی شما نیست و در صورت وجود الزام قانونی، همان الزام رعایت می‌شود."
