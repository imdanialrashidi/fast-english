# Fast English Podcast — Admin Console nginx configuration (production +
# twin). Reproduces the retired Caddy admin block behaviour:
#   * root / -> 308 -> /operator (accepted smoke contract; staged by nginx
#     so Coolify/Traefik does not need a per-path redirect);
#   * /operator (and every Admin route) falls back to index.html; the React
#     data router owns client-side guards (staff-only etc.);
#   * /_/ (PocketBase superuser dashboard) never served: 404;
#   * /api/* routed by the edge proxy (Coolify Traefik) to PocketBase;
#     nginx refuses /api directly (defence in depth);
#   * cache classes: hashed /assets immutable; index.html no-cache; no SW /
#     manifest by design (the Admin is not a PWA);
#   * security headers identical to the retired Caddyfile; gzip on; access
#     log NEVER includes query strings (token redaction rule).
#
# Runs as the unprivileged `nginx` user on port 8080 (see Dockerfile).

worker_processes 1;
pid /tmp/nginx.pid;
# crit: keep emerg/alert/crit only — error-level messages embed the raw
# request line (incl. query strings), which would leak audio/file tokens
# (see tests/infra/08-nginx-redaction.sh).
error_log /dev/stderr crit;


events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  server_tokens off;


  # Security: no query strings in access logs (token redaction rule).
  log_format main_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main_noquery;

  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json font/woff2;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify health check endpoint.
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # --- security headers (identical to the retired Caddyfile) ------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Accepted routing contract: the Admin root lands on the operator
    # surface. 308 (not 301) so the redirect stays reversible.
    location = / {
      return 308 /operator;
    }

    # PocketBase superuser dashboard must never be public.
    location /_/ {
      return 404;
    }

    # API is routed by the edge proxy (Traefik in production) to PocketBase.
    location /api/ {
      return 404;
    }

    # Admin SPA: unknown routes fall back to the shell; the data router
    # shows the AdminNotFoundRoute for paths it does not know.
    location / {
      try_files $uri /index.html;
    }

    # Hashed assets are content-addressed; immutable caching is safe.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # index.html must always revalidate.
    location ~ ^/index\.html$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
  }
}