# Fast English Podcast — Landing nginx configuration (production + twin).
#
# Reproduces the retired Caddy landing block byte-for-byte in behaviour:
#   * static multi-page: serve the file, otherwise the .html twin, otherwise
#     404 (NO SPA fallback — every canonical route is a real file);
#   * /releases/* read-only host volume (APK + release metadata; no index);
#   * the ONLY landing API route is `GET /api/fast-english/public/settings`,
#     which is routed by the edge proxy (Coolify Traefik in production)
#     directly to PocketBase BEFORE reaching nginx. nginx refuses every
#     other /api path (defense in depth — a proxying misconfiguration can
#     never expose arbitrary PocketBase routes through the Landing domain);
#   * cache classes: hashed /assets immutable; HTML no-cache; SEO files
#     short public cache; APK immutable; metadata 1h;
#   * security headers identical to the retired Caddyfile;
#   * gzip on; access log NEVER includes query strings (audio/file tokens
#     travel as ?token=... — see docs/OPERATIONS.md redaction rule).
#
# Runs as the unprivileged `nginx` user on port 8080 (see Dockerfile).

worker_processes 1;
pid /tmp/nginx.pid;
# crit: keep emerg/alert/crit only — error-level messages embed the raw
# request line (incl. query strings), which would leak audio/file tokens
# (see tests/infra/08-nginx-redaction.sh).
error_log /dev/stderr crit;


events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  server_tokens off;

  # Security: no query strings in access logs. This is stronger than
  # redacting token values — the token parameter is never written at all.
  log_format main_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main_noquery;

  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json font/woff2;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify health check endpoint (also used by the infra twin).
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # --- security headers (identical to the retired Caddyfile) ------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- public APK + release metadata (read-only host volume) -------------
    location /releases/ {
      alias /srv/releases/;
      autoindex off;
      location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
      }
      location = /releases/release-metadata.json {
        add_header Cache-Control "public, max-age=3600" always;
      }
      location = /releases/RELEASE-NOTES.md {
        add_header Cache-Control "public, max-age=3600" always;
      }
    }

    # --- API surface: refused here (edge proxy handles the single scoped
    #     public-settings path; see docs/COOLIFY_DEPLOYMENT.md) -------------
    location /api/ {
      return 404;
    }

    # --- static multi-page landing -----------------------------------------
    location / {
      try_files $uri $uri.html =404;
    }

    # Hashed assets are content-addressed; immutable caching is safe.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # HTML (root and *.html pages) must not be cached long (APK link and
    # business settings are runtime data even pre-JS).
    location ~ \.html$ {
      add_header Cache-Control "no-cache" always;
    }
    location = / {
      add_header Cache-Control "no-cache" always;
    }

    # SEO files change rarely; short public cache.
    location ~ ^/(robots\.txt|sitemap\.xml|favicon\.svg|favicon\.png|og-image\.png)$ {
      add_header Cache-Control "public, max-age=3600" always;
    }

    # Security: never bridge /_/ (PocketBase superuser dashboard) here.
    location /_/ {
      return 404;
    }
  }
}