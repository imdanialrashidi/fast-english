# S9a production nginx: Laravel + private X-Accel-Redirect delivery.
# Listens on 8080 so the container runs as non-root (www-data).
# Coolify terminates TLS and forwards HTTP with X-Forwarded-*; Laravel
# trusts the proxy (bootstrap/app.php) so it sees HTTPS.
user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression for the text the Inertia/React bundle ships uncompressed
    # (Vite writes plain .js/.css; Laravel pages are HTML/JSON). Without
    # this the first paint transferred ~3x more bytes than needed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # HSTS is emitted only when Coolify already served the request over
    # HTTPS (X-Forwarded-Proto: https). An empty value makes nginx omit the
    # header, so plain-HTTP requests never advertise HSTS.
    map $http_x_forwarded_proto $fe_hsts {
        default "";
        https   "max-age=31536000";
    }

    # Non-root runtime (www-data): temp paths must be writable without root.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Staff audio uploads are validated at 30 MB (LessonForm) and
        # learner receipts at 5 MB. nginx's 1 MB default rejected both
        # before Laravel could answer with a Persian error.
        client_max_body_size 40m;

        # Baseline browser-hardening headers. `always` keeps them on error
        # responses (403/404/419/500) too, which never reach PHP middleware.
        # Locations below that set their own add_header repeat nosniff,
        # because nginx does not merge add_header across contexts.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $fe_hsts always;

        # S9a private delivery (scope section 16): Laravel checks the
        # policy first, then returns X-Accel-Redirect to this internal
        # location backed by storage/app/private. External requests here
        # return 404 because of `internal`.
        location /_private/ {
            internal;
            alias /var/www/html/storage/app/private/;
        }

        # Public covers only: /storage serves storage/app/public via the
        # storage:link symlink. Private files are never under /storage.
        # `^~` keeps the regex static-asset block below from replacing the
        # immutable header for cover images.
        location ^~ /storage/ {
            alias /var/www/html/storage/app/public/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Fingerprinted Vite output (public/build/manifest.json hashes every
        # file name). Safe to cache forever; a new build gets new names.
        location ^~ /build/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Livewire serves its JS/map from a Laravel route whose path ends in
        # .js, so the static-asset regex below would answer 404 before PHP
        # ever sees it (the Filament panel then renders without Livewire and
        # the login form falls back to a plain GET). Prefix match wins over
        # the regex.
        location ^~ /livewire- {
            try_files $uri /index.php?$query_string;
        }

        # Stable-name static assets (icons, logos, images). Cached but for a
        # shorter window than hashed assets because the name can be reused.
        location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Service worker + manifest are answered by Laravel (no-store /
        # explicit headers), so they must never be served from disk here.
        location = /sw.js {
            try_files $uri /index.php?$query_string;
        }

        location = /manifest.webmanifest {
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Never serve dotfiles, env, or git metadata if they ever land here.
        location ~ /\.(env|git) {
            deny all;
            return 404;
        }
    }
}
