; S9a production PHP: opcache on, errors hidden (APP_DEBUG=false).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
display_errors=0
log_errors=1
; Staff audio uploads validate at 30 MB and learner receipts at 5 MB;
; PHP's 2 MB default silently emptied $_FILES before validation.
upload_max_filesize=40M
post_max_size=48M
