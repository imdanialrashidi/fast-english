# Fast English Podcast — Coolify-equivalent twin edge router.
#
# This nginx acts as a STAND-IN for Coolify's managed Traefik proxy in the
# disposable local twin (infra/compose.yaml). It exists ONLY to prove the
# routing contracts before a real Coolify instance exists; it is never part
# of the production image set.
#
# Reproduces the exact planned Coolify path routing:
#   fastenglishpodcast.com                 -> landing container (root)
#   fastenglishpodcast.com/api/fast-english/public/settings
#                                         -> pocketbase (EXACT path only)
#   fastenglishpodcast.com/api/*           -> 404 (never exposed)
#   www.fastenglishpodcast.com             -> 308 -> canonical root
#   app.fastenglishpodcast.com             -> app container (root)
#   app.fastenglishpodcast.com/api/*       -> pocketbase
#   app.fastenglishpodcast.com/_/*         -> 404
#   admin.fastenglishpodcast.com           -> admin container (root)
#   admin.fastenglishpodcast.com/api/*     -> pocketbase
#   admin.fastenglishpodcast.com/_/*       -> 404
#
# Body limits mirror the retired Caddy block (6 MiB general API, 64 MiB for
# the content-import path). In production the equivalent is a Coolify
# Traefik Request-Buffering middleware (see docs/COOLIFY_DEPLOYMENT.md).

worker_processes 1;
pid /tmp/nginx.pid;
# crit: keep emerg/alert/crit only — error-level messages embed the raw
# request line (incl. query strings), which would leak audio/file tokens
# (see tests/infra/08-nginx-redaction.sh).
error_log /dev/stderr crit;


events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  # Security: the edge (Traefik stand-in) must never write query strings to
  # logs either — audio/file tokens travel as ?token=... (redaction rule).
  log_format edge_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout edge_noquery;

  upstream pocketbase_up { server pocketbase:8090; }
  upstream landing_up    { server landing:8080; }
  upstream app_up        { server app:8080; }
  upstream admin_up      { server admin:8080; }

  # --- landing domain -----------------------------------------------------
  server {
    listen 80;
    server_name fastenglishpodcast.com;

    # THE ONLY public-settings path that may reach PocketBase on this domain.
    location = /api/fast-english/public/settings {
      proxy_pass http://pocketbase_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      limit_except GET { deny all; }
    }
    # Every other API path on the landing domain is refused.
    location /api/ { return 404; }
    # Superuser dashboard never exposed anywhere.
    location /_/ { return 404; }

    location / { proxy_pass http://landing_up; }
  }

  # --- www -> canonical root (308, reversible) ----------------------------
  server {
    listen 80;
    server_name www.fastenglishpodcast.com;
    return 308 http://fastenglishpodcast.com$request_uri;
  }

  # --- app domain ---------------------------------------------------------
  server {
    listen 80;
    server_name app.fastenglishpodcast.com;

    # content-import packages legitimately reach ~60 MiB
    location /api/fast-english/staff/content-import/ {
      client_max_body_size 64m;
      proxy_pass http://pocketbase_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_read_timeout 360s;
    }
    location /api/ {
      client_max_body_size 6m;
      proxy_pass http://pocketbase_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_read_timeout 360s;
    }
    location /_/ { return 404; }

    location / { proxy_pass http://app_up; }
  }

  # --- admin domain -------------------------------------------------------
  server {
    listen 80;
    server_name admin.fastenglishpodcast.com;

    location /api/fast-english/staff/content-import/ {
      client_max_body_size 64m;
      proxy_pass http://pocketbase_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_read_timeout 360s;
    }
    location /api/ {
      client_max_body_size 6m;
      proxy_pass http://pocketbase_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_read_timeout 360s;
    }
    location /_/ { return 404; }

    location / { proxy_pass http://admin_up; }
  }
}