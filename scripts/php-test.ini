; Project verification gate (scripts/project-verify.sh).
;
; The pinned dev image (scripts/dev-php.Dockerfile) ships PHP's stock 128M
; CLI limit. The receipt-upload suite builds a 6 MB fixture in memory and
; aborts at that limit, and `artisan test` runs phpunit as a child process
; that inherits the same ini. This file is mounted read-only into the
; container for the gate only; the host is untouched.
memory_limit = 1G
